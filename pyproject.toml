[project]
name = "wedding-teacher"
version = "0.1.0"
description = "결혼 준비 첫걸음을 함께 짚어주는 Wedding Teacher LangGraph 에이전트"
requires-python = ">=3.13"
dependencies = [
    "langchain[openai]>=0.3.27",
    "langgraph>=0.6.7",
    "langgraph-cli[inmem]>=0.4.2",
    "langsmith>=0.4.28",
    "openai[aiohttp]>=1.107.3",
    "python-dotenv>=1.1.1",
    "streamlit>=1.40.0",
    "tiktoken>=0.11.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: 외부 호출 없는 순수 단위 테스트",
    "integration: 그래프/서브그래프 invoke 테스트 (OpenAI API 호출)",
    "judge: AI-as-judge 평가 (OpenAI API 호출, 비결정적)",
]
